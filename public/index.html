<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mi ASPCH">
  <title>Mi ASPCH</title>
  <link rel="manifest" href="/manifest.webmanifest?v=43760df9cbceeb0a">
  <link rel="icon" href="/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/styles.css?v=300a0c10a7b95e0f">
</head>
<body>
  <div id="toast" class="toast" aria-live="polite"></div>

  <main id="auth-screen" class="auth-screen hidden">
    <section class="auth-clean-card">
      <div class="auth-logo-wrap"><img class="auth-logo" src="/logo-aspch-original.png" alt="Asociación de Pilotos de Chile"></div>
      <h1 class="auth-clean-title">Bienvenido</h1>
      <form id="identity-form" class="auth-clean-form">
        <label id="login-rut-label" class="clean-label">RUT
          <input id="login-rut" class="clean-input" type="text" inputmode="text" autocomplete="username" autocapitalize="characters" spellcheck="false" placeholder="12.345.678-5">
        </label>
        <label id="login-email-label" class="clean-label">Correo electrónico
          <input id="login-email" class="clean-input" type="email" autocomplete="email" autocapitalize="none" spellcheck="false" placeholder="nombre@correo.cl" required>
        </label>
        <button class="button primary clean-btn" type="submit">Continuar</button>
        <p class="auth-error hidden" role="alert"></p>
        <p id="identity-help" class="hint hidden"></p>
      </form>
      <form id="code-form" class="auth-clean-form hidden">
        <button type="button" id="back-identity" class="link-button clean-link">← Cambiar RUT o correo</button>
        <div id="code-primary-wrap">
          <label id="code-primary-label" class="clean-label">Código enviado a tu correo
            <input id="login-code" class="otp-input clean-pin-input" type="tel" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" maxlength="6" placeholder="000000" required>
          </label>
        </div>
        <div id="code-old-wrap" class="hidden">
          <label id="code-old-label" class="clean-label">Código enviado al correo registrado
            <input id="login-old-code" class="otp-input clean-pin-input" type="tel" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" maxlength="6" placeholder="000000">
          </label>
        </div>
        <button class="button primary clean-btn" type="submit">Verificar identidad</button>
        <button id="retry-code" class="button ghost clean-btn-sec" type="button">Reenviar código</button>
        <p class="auth-error hidden" role="alert"></p>
        <p id="code-help" class="hint hidden"></p>
      </form>
      <form id="pin-setup-form" class="auth-clean-form hidden">
        <h2 style="font-size:20px;margin:0 0 10px;text-align:center;font-weight:750;">Crea tu PIN</h2>
        <label class="clean-label">PIN de 4 a 6 dígitos
          <input id="setup-pin" class="clean-pin-input" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="off" minlength="4" maxlength="6" placeholder="••••" required>
        </label>
        <label class="clean-label">Repite el PIN
          <input id="setup-pin-confirm" class="clean-pin-input" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="off" minlength="4" maxlength="6" placeholder="••••" required>
        </label>
        <button class="button primary clean-btn" type="submit">Activar Mi ASPCH</button>
        <p class="auth-error hidden" role="alert"></p>
      </form>
    </section>
  </main>

  <main id="lock-screen" class="lock-screen hidden">
    <section class="lock-clean-card">
      <div class="auth-logo-wrap"><img class="auth-logo" src="/logo-aspch-original.png" alt="Asociación de Pilotos de Chile"></div>
      <h1 id="lock-greeting" class="auth-clean-title">Bienvenido</h1>
      <button id="biometric-button" class="button primary clean-btn hidden" type="button" disabled>Usar Face ID / huella</button>
      <button id="show-pin-button" class="button ghost clean-btn-sec hidden" type="button">Usar PIN</button>
      <form id="unlock-form" class="auth-clean-form">
        <input id="unlock-pin" class="clean-pin-input" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="current-password" maxlength="6" placeholder="Ingresa tu PIN" required>
        <button id="unlock-submit" class="button primary clean-btn" type="submit">Acceder</button>
        <p class="auth-error hidden" role="alert"></p>
      </form>
      <p id="biometric-help" class="hint hidden"></p>
      <button id="lock-logout" class="link-button clean-link" type="button">Usar otra cuenta</button>
    </section>
  </main>

  <div id="app-shell" class="app-shell hidden">
    <aside class="sidebar">
      <div class="brand sidebar-brand">
        <img class="sidebar-logo" src="/logo-aspch-original.png" alt="Asociación de Pilotos de Chile">
        <div><strong>Mi ASPCH</strong><span>Portal de asociados</span></div>
      </div>
      <nav id="desktop-nav" class="nav-list"></nav>
      <div class="sidebar-profile">
        <div id="sidebar-avatar" class="avatar">A</div>
        <div class="sidebar-user"><strong id="sidebar-name">Socio</strong><span id="sidebar-role">Asociado</span></div>
        <button id="logout" class="icon-button" title="Cerrar sesión">↪</button>
      </div>
    </aside>

    <section class="main-area">
      <header class="topbar">
        <div class="topbar-title-wrap"><button id="more-menu-toggle" class="icon-button mobile-more-button" title="Servicios" aria-label="Abrir servicios">☰</button><div><span class="eyebrow">MI ASPCH</span><h2 id="page-title">Inicio</h2></div></div>
        <div class="top-actions">
          <button id="install-app" class="button ghost hidden">Instalar app</button>
          <div class="account-menu-wrap">
            <button id="top-avatar" class="avatar avatar-button" type="button" aria-label="Abrir menú de cuenta" aria-haspopup="menu" aria-expanded="false">A</button>
            <div id="account-menu" class="account-menu hidden" role="menu">
              <button type="button" data-account-view="profile" role="menuitem"><span>👤</span>Perfil</button>
              <button type="button" data-account-view="security" role="menuitem"><span>🔐</span>Seguridad</button>
              <button type="button" data-account-view="membership" role="menuitem"><span>💳</span>Mensualidad</button>
              <button type="button" data-account-view="credential" role="menuitem"><span>🪪</span>Credencial</button>
              <button type="button" data-account-view="contact" role="menuitem"><span>📞</span>Contacto</button>
              <div class="account-menu-separator"></div>
              <button id="account-menu-lock" type="button" role="menuitem"><span>🔒</span>Bloquear</button>
              <button id="account-menu-logout" type="button" role="menuitem" class="account-menu-danger"><span>↪</span>Cerrar sesión</button>
            </div>
          </div>
        </div>
      </header>
      <div id="view" class="view"></div>
    </section>

    <nav id="mobile-nav" class="mobile-nav"></nav>
    <div id="mobile-more-backdrop" class="mobile-drawer-backdrop hidden"></div>
    <aside id="mobile-more-drawer" class="mobile-drawer hidden" aria-label="Más servicios de Mi ASPCH">
      <div class="mobile-drawer-head"><div><span class="eyebrow">MI ASPCH</span><h3>Servicios</h3></div><button id="mobile-more-close" class="icon-button" aria-label="Cerrar menú">✕</button></div>
      <nav id="mobile-more-nav" class="mobile-more-nav"></nav>
    </aside>
  </div>

  <script src="/app.js?v=d79a54e2c2c3af8a" defer></script>
</body>
</html>
