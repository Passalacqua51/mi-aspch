name: aspch

services:
  mi-aspch:
    image: mi-aspch:v0.6.4-moroso-preview
    container_name: mi-aspch
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HOST_PORT:-8085}:8080"
    volumes:
      - mi_aspch_data:/data
      - /mnt/MediaCenter/aspch/sipa-fotos:/data/sipa-fotos:ro
      - /mnt/MediaCenter/aspch/sipa-retratos:/data/sipa-retratos:ro
      - /mnt/MediaCenter/aspch/profile-fotos:/data/profile-fotos
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  mi_aspch_data:
